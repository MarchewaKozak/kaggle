name: MC Server Keepalive

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install kaggle
        run: pip install -q kaggle

      - name: Check and restart kernel
        id: check
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL_REF: "ojwojtek/mc-server-code"
        run: |
          python3 << 'PYEOF'
          import subprocess, os, sys, tempfile, shutil
          from datetime import datetime, timezone

          KERNEL = os.environ["KERNEL_REF"]
          TOKEN = os.environ["KAGGLE_API_TOKEN"]
          ENV = {**os.environ, "KAGGLE_API_TOKEN": TOKEN}

          def cmd(c):
              return subprocess.run(c, capture_output=True, text=True, env=ENV)

          now = datetime.now(timezone.utc)

          # Check status
          r = cmd(["kaggle", "kernels", "status", KERNEL])
          status = r.stdout.strip().lower()
          print(f"[{now.strftime('%H:%M')}] Status: {status}")

          if "running" in status:
              print("RESULT:already_running")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("result=already_running\n")
              sys.exit(0)

          # Not running — restart
          print(f"Not running ({status}), restarting...")
          d = tempfile.mkdtemp()
          try:
              r = cmd(["kaggle", "kernels", "pull", "-p", d, "-m", KERNEL])
              if r.returncode != 0:
                  err = r.stderr[:200]
                  print(f"Pull failed: {err}")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"result=failed\nreason=pull: {err}\n")
                  sys.exit(1)

              r = cmd(["kaggle", "kernels", "push", "-p", d])
              if r.returncode != 0:
                  err = r.stderr[:200]
                  print(f"Push failed: {err}")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"result=failed\nreason=push: {err}\n")
                  sys.exit(1)

              print(f"Restarted: {r.stdout.strip()}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("result=restarted\nreason=\n")
          finally:
              shutil.rmtree(d, ignore_errors=True)
          PYEOF

      - name: Notify on restart
        if: steps.check.outputs.result == 'restarted'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🟢 **MC Server restarted** — was down, now back up. $(date -u +%H:%M) UTC\"}" \
            "$DISCORD_WEBHOOK"

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\": \"🔴 **MC Server keepalive FAILED** — could not restart! Reason: ${{ steps.check.outputs.reason }} — $(date -u +%H:%M) UTC\"}" \
            "$DISCORD_WEBHOOK"
