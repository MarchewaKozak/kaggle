name: MC Server Keepalive

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install kaggle
        run: pip install -q kaggle

      - name: Check and restart kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL_REF: "ojwojtek/mc-server-code"
        run: |
          python3 << 'PYEOF'
          import subprocess, os, sys, tempfile, shutil, time
          from datetime import datetime, timezone

          KERNEL = os.environ["KERNEL_REF"]
          TOKEN = os.environ["KAGGLE_API_TOKEN"]
          ENV = {**os.environ, "KAGGLE_API_TOKEN": TOKEN}

          def cmd(c):
              return subprocess.run(c, capture_output=True, text=True, env=ENV)

          now = datetime.now(timezone.utc)
          r = cmd(["kaggle", "kernels", "status", KERNEL])
          status = r.stdout.strip().lower()
          print(f"[{now.strftime('%H:%M')}] Status: {status}")

          if "running" in status:
              print("Already running — OK")
              sys.exit(0)

          print(f"Not running ({status}), restarting...")
          d = tempfile.mkdtemp()
          try:
              # Pull latest version
              r = cmd(["kaggle", "kernels", "pull", "-p", d, "-m", KERNEL])
              if r.returncode != 0:
                  print(f"Pull failed: {r.stderr[:300]}"); sys.exit(1)

              # Push with run flag
              r = cmd(["kaggle", "kernels", "push", "-p", d])
              if r.returncode != 0:
                  print(f"Push failed: {r.stderr[:300]}"); sys.exit(1)
              print(f"Pushed: {r.stdout.strip()}")

              # Wait for session to start
              print("Waiting for session to start...")
              for i in range(12):
                  time.sleep(5)
                  r = cmd(["kaggle", "kernels", "status", KERNEL])
                  s = r.stdout.strip().lower()
                  print(f"  [{i*5}s] {s}")
                  if "running" in s:
                      print("Session is running!")
                      sys.exit(0)

              print("Session did not start within 60s")
              sys.exit(1)
          finally:
              shutil.rmtree(d, ignore_errors=True)
          PYEOF
