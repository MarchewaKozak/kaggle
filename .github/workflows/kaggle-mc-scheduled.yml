name: Kaggle MC Scheduled Server

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
    - cron: '*/30 * * * *'
  workflow_dispatch:

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  MINECRAFT_VERSION: "1.21.1"
  SERVER_MOTD: "Martin Kaggle MC Server"
  MAX_PLAYERS: "20"
  DATASET_SLUG: "system.pliki/mc-server-full-backup"
  NOTEBOOK_SLUG: "mc-server-scheduled"
  BOOT_WINDOW_SECONDS: "900"

jobs:
  scheduled-start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - name: Anchor-aligned session manager
        run: python .github/scripts/scheduled_keepalive.py
      - run: pip install requests kaggle
